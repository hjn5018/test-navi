name: test_navi
description: "Test-Navi: 시각 장애인 및 저시력 사용자를 위한 AI 음성 기반 브라우저 및 Windows 자동화 어시스턴트"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # --- 상태 관리 ---
  flutter_riverpod: ^2.6.1

  # --- HTTP / WebSocket 통신 ---
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.3

  # --- 오디오 ---
  record: ^6.2.0
  just_audio: ^0.9.46

  # --- 시스템 트레이 (Phase 2) ---
  # system_tray: ^2.0.3

  # --- 윈도우 관리 (Phase 2) ---
  # window_manager: ^0.4.2

  # --- 유틸리티 ---
  uuid: ^4.5.1
  logger: ^2.5.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # --- 폰트 (접근성 최적화) ---
